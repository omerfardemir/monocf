name: release

# Started by hand, on main: Actions, release, Run workflow. It does only what the version in
# package.json is still missing, so running it again picks a failed release up where it stopped.
# docs/releasing.md has the setup on npmjs.com, and what to do when a run fails.
#
# Everything is in one workflow because a release made with GITHUB_TOKEN can't start another
# workflow. This way the repository stores no secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      commit: ${{ steps.check.outputs.commit }}
      publish: ${{ steps.check.outputs.publish }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: See what this version is missing
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The run form lets anyone pick a branch. npm can't tell, so this is the only thing that stops it.
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases run from main, and this run is on $GITHUB_REF_NAME."
            exit 1
          fi

          # Anything but a clear yes or no stops the run, so an outage can't look like a new version.
          missing() {
            code=$(curl --silent --retry 3 --max-time 30 --output /dev/null --write-out '%{http_code}' "$@")
            case "$code" in
              200) echo false ;;
              404) echo true ;;
              *)
                echo "::error::$1 answered $code, so this run can't tell what's missing." >&2
                return 1
                ;;
            esac
          }

          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          publish=$(missing "https://registry.npmjs.org/$name/$version")
          release=$(missing "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/v$version" --header "Authorization: Bearer $GH_TOKEN")

          # A version already on npm gets its tag on the commit npm names, not on whatever this push is.
          commit=$GITHUB_SHA
          if [ "$publish" = false ] && [ "$release" = true ]; then
            commit=$(npm view "$name@$version" gitHead)
            if [ -z "$commit" ]; then
              echo "::error::npm doesn't say which commit $name@$version came from, so its tag and release have to be made by hand."
              exit 1
            fi
          fi

          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

          if [ "$publish" = false ] && [ "$release" = false ]; then
            echo "::notice file=package.json,line=1::$name@$version is already on npm and has a release, so there's nothing to do. Change the version in package.json to release a new one."
          else
            echo "$name@$version: publish to npm: $publish, create the release: $release"
          fi

  # Runs the project's code with a token that can't write. Nothing below runs unless this passes.
  test:
    needs: check
    if: needs.check.outputs.publish == 'true' || needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm test

  # npm trusted publishing: the registry takes this job's OIDC token, so no npm token is stored.
  # On npmjs.com, the package's trusted publisher has to name this file and allow npm publish.
  # Needs npm 11.5.1 or later, which is why this job is on Node 24.
  # --ignore-scripts keeps dependencies' install scripts away from that token. --loglevel=verbose
  # is there because npm only says why a token exchange was refused at that level.
  publish:
    needs: [check, test]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm publish --loglevel=verbose

  # After publish, so that a tag and a release only ever name a version that's on npm. Apart from
  # publish, so that its actions never run beside the token that can publish.
  github-release:
    needs: [check, test, publish]
    # publish is skipped when the version is already on npm, and that shouldn't stop this job.
    if: >-
      !cancelled() &&
      needs.check.outputs.release == 'true' &&
      needs.test.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build

      # Pack as .tgz tarball for distribution
      - name: Generate .tgz package
        run: npm pack --pack-destination ./dist

      # Extract and zip npm package
      - name: Extract and zip npm package
        run: |
          tarball=$(ls ./dist/*.tgz)
          filename=$(basename "$tarball" .tgz)
          mkdir -p ./dist/unpacked
          tar -xzf "$tarball" -C ./dist/unpacked

          cd ./dist/unpacked/package
          zip -r ../../$filename.zip .

      # A failed upload has to turn the run red, because a later run sees the release and stops. The
      # two update settings let a re-run finish a release that exists, and keep its notes.
      - name: Create the tag and the release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ needs.check.outputs.tag }}
          name: Release ${{ needs.check.outputs.tag }}
          commit: ${{ needs.check.outputs.commit }}
          generateReleaseNotes: true
          artifactErrorsFailBuild: true
          allowUpdates: true
          omitBodyDuringUpdate: true
          artifacts: |
            ./dist/*.tgz
            ./dist/*.zip
